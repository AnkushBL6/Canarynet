name: CanaryNet CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: canarynet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and independent SDK fixture dependency
        run: |
          python -m pip install . 'mcp>=1.28,<2'
          python -m pip freeze
      - name: Compile and test, including official SDK interoperability
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: Verify installed CLI and intentional demo regression
        shell: bash
        run: |
          canarynet --version
          canarynet init ci-demo
          canarynet validate -c ci-demo/canarynet.json
          set +e
          canarynet check -c ci-demo/canarynet.json --allow-exec --output .canarynet/ci-report
          code=$?
          set -e
          test "$code" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('.canarynet/ci-report/report.json').read_text())
          assert report['counts']['regression'] == 2
          assert report['counts']['compatible'] == 2
          assert report['surfaceChanges'] == []
          print('Same-schema behavioral regression verified against real subprocesses.')
          PY
      - name: Verify composite action refuses implicit execution
        run: python -c "from pathlib import Path; assert 'allow-exec' in Path('action.yml').read_text()"
