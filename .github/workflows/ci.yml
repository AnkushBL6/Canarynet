name: CanaryNet CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: canarynet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and independent SDK fixture dependency
        run: |
          python -m pip install . 'mcp>=1.28,<2'
          python -m pip freeze
      - name: Compile and test, including official SDK interoperability
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
      - name: Verify installed CLI and intentional demo regression
        shell: bash
        run: |
          canarynet --version
          canarynet init ci-demo
          canarynet validate -c ci-demo/canarynet.json
          set +e
          canarynet check -c ci-demo/canarynet.json --allow-exec --output .canarynet/ci-report
          code=$?
          set -e
          test "$code" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('.canarynet/ci-report/report.json').read_text())
          assert report['counts']['regression'] == 2
          assert report['counts']['compatible'] == 2
          assert report['surfaceChanges'] == []
          print('Same-schema behavioral regression verified against real subprocesses.')
          PY
      - name: Exercise action without execution acknowledgement
        id: blocked_action
        continue-on-error: true
        uses: ./
        with:
          config: ci-demo/canarynet.json
          output: .canarynet/action-blocked
      - name: Verify action refused execution and wrote no report
        env:
          BLOCKED_OUTCOME: ${{ steps.blocked_action.outcome }}
        run: |
          test "$BLOCKED_OUTCOME" = failure
          test ! -e .canarynet/action-blocked
      - name: Exercise action against intentionally broken candidate
        id: breaking_action
        continue-on-error: true
        uses: ./
        with:
          config: ci-demo/canarynet.json
          output: .canarynet/action-breaking
          allow-exec: 'true'
      - name: Verify action detected regressions and prepare compatible candidate
        env:
          BREAKING_OUTCOME: ${{ steps.breaking_action.outcome }}
        run: |
          test "$BREAKING_OUTCOME" = failure
          python - <<'PYCODE'
          import json
          from pathlib import Path
          report = json.loads(Path('.canarynet/action-breaking/report.json').read_text())
          assert report['exitCode'] == 1
          assert report['counts']['regression'] == 2
          path = Path('ci-demo/canarynet.json')
          config = json.loads(path.read_text())
          config['candidate']['command'][-1] = 'compatible'
          config['candidate']['revision'] = 'synthetic-compatible'
          path.write_text(json.dumps(config))
          PYCODE
      - name: Exercise action against compatible candidate
        uses: ./
        with:
          config: ci-demo/canarynet.json
          output: .canarynet/action-compatible
          allow-exec: 'true'
      - name: Verify action compatible report
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          report = json.loads(Path('.canarynet/action-compatible/report.json').read_text())
          assert report['exitCode'] == 0
          assert report['counts']['compatible'] == 4
          assert report['surfaceChanges'] == []
          print('Composite action verified: refuses implicit execution, catches regressions, accepts compatible cases.')
          PYCODE
