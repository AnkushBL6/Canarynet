name: CanaryNet consumer compatibility
description: Run explicit consumer contracts against local baseline and candidate MCP servers
inputs:
  config:
    description: Path to a reviewed CanaryNet JSON configuration in the checked-out repository
    required: true
  output:
    description: Local output directory; artifacts are not uploaded automatically
    default: .canarynet/reports/latest
  allow-exec:
    description: Set to true only for reviewed server commands and disposable test data; this is not a sandbox
    default: 'false'
runs:
  using: composite
  steps:
    - name: Require explicit execution acknowledgement
      shell: bash
      env:
        CANARY_ALLOW_EXEC: ${{ inputs.allow-exec }}
      run: |
        if [ "$CANARY_ALLOW_EXEC" != 'true' ]; then
          echo 'CanaryNet: execution refused. Review commands and explicitly set allow-exec: true.' >&2
          exit 2
        fi
    - name: Install CanaryNet from this action revision
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Check consumer compatibility
      shell: bash
      env:
        CANARY_CONFIG: ${{ inputs.config }}
        CANARY_OUTPUT: ${{ inputs.output }}
      run: python -m canarynet check --config "$CANARY_CONFIG" --output "$CANARY_OUTPUT" --allow-exec
